name: Windows SignPath preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.3'
          architecture: x64
      - name: Install locked build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Test distribution and update guards
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m pytest -q tests/test_distribution.py tests/test_windows_signing.py tests/test_packaging.py tests/test_updates.py
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build unsigned review candidate
        shell: pwsh
        run: ./packaging/build.ps1 -OutputRoot dist/signpath-preflight -AllowUnsigned
      - name: Upload candidate and dependency evidence
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-preflight-${{ github.sha }}
          path: dist/signpath-preflight/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

# Intentionally no SignPath request and no GitHub Release publication.
# Enable signing only after the application, notices/source review and
# SignPath project/policy setup described in docs/signpath-application.md.
