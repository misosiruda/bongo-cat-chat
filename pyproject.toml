[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bongo-cat-chat"
version = "0.1.0.dev20"
description = "Windows messenger for the existing Bongo Cat lobby"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6==6.12.0", "psutil==7.2.2", "UnityPy==1.25.4", "cryptography==50.0.2", "pefile==2024.8.26",
    "winrt-runtime==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications==3.2.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3", "playwright==1.63.0"]

[project.scripts]
bongo-cat-chat = "bongo_chat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bongo_chat = ["ui/*", "feature-contract.json", "update-config.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
